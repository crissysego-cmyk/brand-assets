services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.js"]
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    environment:
      - PORT=3000
      - BASE44_PREVIEW_MODE
    restart: on-failure
    labels:
      base44.project: Brand Assets
      base44.kind: web
      base44.port: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
